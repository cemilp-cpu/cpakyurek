<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yalın Türkçe Sözcüklük</title>
<style>
* {
box-sizing: border-box;
font-family: 'Courier New', Courier, monospace !important;
font-weight: bold !important;
font-size: 20px !important;
color: #000000;
}
body {
margin: 0;
padding: 5px;
background-color: #dcdcdc;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
position: relative;
}
.yonetici-girisi {
position: absolute;
top: 10px;
right: 10px;
font-size: 13px !important;
background: #2c3e50;
color: #ffffff !important;
border: 2px solid #000000;
padding: 4px 8px;
cursor: pointer;
border-radius: 4px;
z-index: 1000;
}
.ana-cerceve {
width: 100%;
max-width: 440px;
background-color: #ffff00;
border: 5px solid #000000;
border-radius: 12px;
padding: 12px;
display: flex;
flex-direction: column;
gap: 10px;
box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
}
.baslik-alani {
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
border-bottom: 3px solid #000000;
padding-bottom: 8px;
text-align: center;
}
.kizil-yildiz {
width: 24px;
height: 24px;
flex-shrink: 0;
animation: parildama 1.5s infinite ease-in-out;
}
@keyframes parildama {
0% { opacity: 0.6; transform: scale(0.9); }
50% { opacity: 1; transform: scale(1.1); }
100% { opacity: 0.6; transform: scale(0.9); }
}
.baslik-metni {
font-size: 20px !important;
line-height: 1.2;
}
.girdi-alani {
width: 100%;
padding: 10px;
text-align: center;
border: 3px solid #000000;
border-radius: 6px;
text-transform: uppercase;
background-color: #ffffff;
}
.dugme-satiri {
display: flex;
gap: 8px;
}
.btn {
flex: 1;
padding: 12px;
color: #ffffff !important;
border: 3px solid #000000;
border-radius: 6px;
cursor: pointer;
text-transform: uppercase;
}
.btn-bul { background-color: #005580; }
.btn-sor { background-color: #e74c3c; }

.kategori-satiri {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 5px;
}
.btn-kat {
padding: 6px;
font-size: 15px !important;
color: #ffffff !important;
border: 2px solid #000000;
border-radius: 4px;
cursor: pointer;
}
.btn-saglik { background-color: #2ecc71; }
.btn-bilim { background-color: #9b59b6; }
.btn-haklilik { background-color: #e67e22; }
.btn-alt { grid-column: span 1.5; background-color: #2980b9; }

.mavi-ekran {
width: 100%;
height: 100px;
background-color: #aed6f1;
border: 3px solid #3498db;
border-radius: 6px;
padding: 8px;
overflow-y: auto;
}
.sayac-grubu {
display: flex;
gap: 6px;
width: 100%;
}
.sayac-kutu {
flex: 1;
background-color: #ffffff;
border: 2px solid #000000;
padding: 6px 2px;
border-radius: 6px;
text-align: center;
font-size: 13px !important;
}
.sayac-kutu span { font-size: 13px !important; }
.arka-oda { display: none; width: 100%; max-width: 440px; background-color: #ffffff; border: 4px solid #2c3e50; border-radius: 8px; margin-top: 10px; padding: 10px; text-align: center; }
</style>
</head>

function toplamSozcukSay() {
return sozluk.length + sozlukSaglik.length + sozlukHaklilik.length + sozlukBilim.length + sozlukTgid.length + sozlukCokluk.length;
}

function sayacGuncelle() {
document.getElementById('sayac-top').innerText = toplamSozcukSay();
document.getElementById('sayac-toplam-gezer').innerText = toplamGezerSayisi;
}

function sozcukBul() {
let aranan = document.getElementById('soru-alani').value.trim().toLowerCase();
let ekran = document.getElementById('sonuc-ekrani');
if(!aranan) { ekran.innerHTML = "Lütfen bir sözcük yazın."; return; }

toplamGezerSayisi++;
document.getElementById('sayac-gezilen').innerText = aranan.toUpperCase();

let tumHavuz = [...sozluk, ...sozlukSaglik, ...sozlukHaklilik, ...sozlukBilim, ...sozlukTgid, ...sozlukCokluk];

let sonuclar = tumHavuz.filter(item => {
let sol = (item.A || "").toString().toLowerCase();
let sag = (item.B || "").toString().toLowerCase();
return sol.includes(aranan) || sag.includes(aranan);
});

if(sonuclar.length > 0) {
ekran.innerHTML = sonuclar.map((item, i) => `${i+1}- ${item.A} = ${item.B}`).join('<br>');
} else {
ekran.innerHTML = "Sözcük bulunamadı.";
}
sayacGuncelle();
}

function kategoriFiltre(ilgiliDizi, kategoriAdi) {
let ekran = document.getElementById('sonuc-ekrani');
toplamGezerSayisi++;
document.getElementById('sayac-gezilen').innerText = kategoriAdi;

if(ilgiliDizi.length > 0) {
ekran.innerHTML = ilgiliDizi.map((item, i) => `${i+1}- ${item.A} = ${item.B}`).join('<br>');
} else {
ekran.innerHTML = "Bu alanda sözcük bulunamadı.";
}
sayacGuncelle();
}

function soruTemizle() {
let soruAlani = document.getElementById('soru-alani');
soruAlani.value = '';
document.getElementById('sonuc-ekrani').innerHTML = 'Yeni arama için hazır.';
document.getElementById('sayac-gezilen').innerText = '-';
toplamGezerSayisi++;
sayacGuncelle();
soruAlani.focus();
}

function arkaOdaAc() {
let oda = document.getElementById('arka-oda-paneli');
if (oda.style.display === 'block') {
oda.style.display = 'none';
} else {

if (sifre === "kasim1973") {

} else {

}
}
