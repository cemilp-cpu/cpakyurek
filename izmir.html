* { box-sizing: border-box; margin: 0; padding: 0; }

/* EKRAAN TAM SIĞMA VE DIŞ KAYDIRMA ÇUBUĞUNU ENGELLEME */
html, body {
height: 100vh;
overflow: hidden;
background: #e8e8e8;
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
}

.bayrak {
background: #e30a17;
color: #fff;
padding: 8px;
font-weight: bold;
border-bottom: 3px solid #000;
text-align: center;
flex-shrink: 0;
}

.ana-kapsayici {
flex: 1;
padding: 10px;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
}

.kutu {
width: 100%;
max-width: 650px;
height: 100%;
background: #fff;
padding: 12px;
border: 3px solid #000;
border-radius: 10px;
display: flex;
flex-direction: column;
text-align: center;
}

h1 { font-size: 1.2rem; margin-bottom: 4px; flex-shrink: 0; }
.felsefe { font-size: 0.8rem; font-weight: bold; background: #000; color: #fff; padding: 4px; margin-bottom: 8px; flex-shrink: 0; }

#girdi {
width: 100%;
padding: 8px;
font-size: 1.1rem;
font-weight: bold;
border: 3px solid #000;
background: #ffff00;
text-align: center;
text-transform: uppercase;
margin-bottom: 6px;
flex-shrink: 0;
}

.dugme {
width: 100%;
padding: 8px;
font-size: 1rem;
font-weight: bold;
border: 2px solid #000;
background: #000;
color: #fff;
cursor: pointer;
margin-bottom: 6px;
flex-shrink: 0;
}

/* GÖRÜNTÜLEYİCİ ALANI */
#gosterici {
flex: 1;
padding: 8px;
font-size: 1.1rem;
font-weight: bold;
border: 3px solid #000;
background: #ffff00;
text-align: left;
overflow-y: auto;
white-space: pre-wrap;
margin-bottom: 6px;
position: relative;
}

/* EN ÜSTTE SABİT DURSUN DİYE YAPILAN SÖZCÜKLÜĞE DÖN DÜĞMESİ */
.don-dugmesi {
position: sticky;
top: 0;
z-index: 100;
width: 100%;
padding: 10px;
background: #e30a17;
color: #fff;
font-size: 1.1rem;
font-weight: bold;
border: 2px solid #000;
cursor: pointer;
margin-bottom: 8px;
box-shadow: 0px 2px 5px rgba(0,0,0,0.3);
}

.sayac {
font-size: 0.85rem;
font-weight: bold;
background: #000;
color: #fff;
padding: 5px;
flex-shrink: 0;
margin-bottom: 6px;
}
</style>
</head>

// SAYFA YÜKLENİNCE ÇALIŞACAK İŞLEVLER
window.onload = function() {
guncelleSayac();

document.getElementById('anaBtn').addEventListener('click', sozcukAra);
document.getElementById('gosterBtn').addEventListener('click', sozcukluguGoster);
document.getElementById('girdi').addEventListener('keypress', function(e) {
if (e.key === 'Enter') {
sozcukAra();
}
});
};

// SÖZCÜK SAYISINI GÜNCELLEME
function guncelleSayac() {
document.getElementById('sayac').innerText = 'Sözcüklükte: ' + sozverisi.length + ' sözcük';
}

// ARAMA İŞLEVİ (KÜÇÜK HARFLİ VERİLERE UYUMLU VE BÜYÜK TÜRKÇE HARF DUYARLI)
function sozcukAra() {
var aranan = document.getElementById('girdi').value.trim().toLocaleUpperCase('tr-TR');
var gosterici = document.getElementById('gosterici');

if (aranan === "") {
gosterici.innerHTML = "LÜTFEN BİR SÖZCÜK YAZIN.";
return;
}

var bulunanlar = [];

for (var i = 0; i < sozverisi.length; i++) {
var a = String(sozverisi[i].A).toLocaleUpperCase('tr-TR');
var b = String(sozverisi[i].B).toLocaleUpperCase('tr-TR');

if (a.indexOf(aranan) !== -1 || b.indexOf(aranan) !== -1) {
bulunanlar.push((i + 1) + '. ' + String(sozverisi[i].A).toLocaleUpperCase('tr-TR') + ' -> ' + String(sozverisi[i].B).toLocaleUpperCase('tr-TR'));
}
}

if (bulunanlar.length > 0) {
gosterici.innerHTML = bulunanlar.join('\n');
} else {
gosterici.innerHTML = "ARANAN SÖZCÜK BULUNAMADI.";
}
}

// TÜM SÖZCÜKLÜĞÜ GÖSTERME İŞLEVİ
function sozcukluguGoster() {
if (!yonetici) {
var sifre = prompt("Yönetici Gizli Sözünü girin:");
if (sifre === YONETICI_GIZLISOZ) {
yonetici = true;
} else {
alert("Hatalı gizli söz!");
return;
}
}

document.getElementById('girdi').style.display = 'none';
document.getElementById('anaBtn').style.display = 'none';
document.getElementById('sayac').style.display = 'none';
document.getElementById('gosterBtn').style.display = 'none';

var gosterici = document.getElementById('gosterici');

if (sozverisi.length === 0) {
gosterici.innerHTML = 'HENÜZ SÖZCÜK YOK.';
} else {
var dokum = '<button type="button" class="don-dugmesi" id="donBtn">SÖZCÜKLÜĞE DÖN</button>\n';
for (var i = 0; i < sozverisi.length; i++) {
var s = sozverisi[i];
dokum += (i + 1) + '. ' + String(s.A).toLocaleUpperCase('tr-TR') + ' -> ' + String(s.B).toLocaleUpperCase('tr-TR') + '\n';
}
gosterici.innerHTML = dokum;
document.getElementById('donBtn').addEventListener('click', sozcuklugeDon);
}
}

// ARAMA EKRANINA GERİ DÖNME İŞLEVİ
function sozcuklugeDon() {
document.getElementById('girdi').style.display = 'block';
document.getElementById('anaBtn').style.display = 'block';
document.getElementById('sayac').style.display = 'block';
document.getElementById('gosterBtn').style.display = 'block';

var gosterici = document.getElementById('gosterici');
gosterici.innerHTML = 'HAZIR';
}
