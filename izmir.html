<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SÖZCÜKLÜK</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* EKRAAN TAM SIĞMA VE DIŞ KAYDIRMA ÇUBUĞUNU ENGELLEME */
html, body {
height: 100vh;
overflow: hidden;
background: #e8e8e8;
font-family: Arial, sans-serif;
display: flex;
flex-direction: column;
}

.bayrak {
background: #e30a17;
color: #fff;
padding: 8px;
font-weight: bold;
border-bottom: 3px solid #000;
text-align: center;
flex-shrink: 0;
}

.ana-kapsayici {
flex: 1;
padding: 10px;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
}

.kutu {
width: 100%;
max-width: 650px;
height: 100%;
background: #fff;
padding: 12px;
border: 3px solid #000;
border-radius: 10px;
display: flex;
flex-direction: column;
text-align: center;
}

h1 { font-size: 1.2rem; margin-bottom: 4px; flex-shrink: 0; }
.felsefe { font-size: 0.8rem; font-weight: bold; background: #000; color: #fff; padding: 4px; margin-bottom: 8px; flex-shrink: 0; }

#girdi {
width: 100%;
padding: 8px;
font-size: 1.1rem;
font-weight: bold;
border: 3px solid #000;
background: #ffff00;
text-align: center;
text-transform: uppercase;
margin-bottom: 6px;
flex-shrink: 0;
}

.dugme {
width: 100%;
padding: 8px;
font-size: 1rem;
font-weight: bold;
border: 2px solid #000;
background: #000;
color: #fff;
cursor: pointer;
margin-bottom: 6px;
flex-shrink: 0;
}

/* GÖRÜNTÜLEYİCİ ALANI */
#gosterici {
flex: 1;
padding: 8px;
font-size: 1.1rem;
font-weight: bold;
border: 3px solid #000;
background: #ffff00;
text-align: left;
overflow-y: auto;
white-space: pre-wrap;
margin-bottom: 6px;
position: relative;
}

/* EN ÜSTTE SABİT DURSUN DİYE YAPILAN SÖZCÜKLÜĞE DÖN DÜĞMESİ */
.don-dugmesi {
position: sticky;
top: 0;
z-index: 100;
width: 100%;
padding: 10px;
background: #e30a17;
color: #fff;
font-size: 1.1rem;
font-weight: bold;
border: 2px solid #000;
cursor: pointer;
margin-bottom: 8px;
box-shadow: 0px 2px 5px rgba(0,0,0,0.3);
}

.sayac {
font-size: 0.85rem;
font-weight: bold;
background: #000;
color: #fff;
padding: 5px;
flex-shrink: 0;
margin-bottom: 6px;
}
</style>
</head>
<body>

<div class="bayrak">1 MAYIS EMEK VE DAYANIŞMA YÜCELTİLSİN</div>

<div class="ana-kapsayici">
<div class="kutu">
<h1>cpakyürek SANAL YÖRESİ</h1>
<div class="felsefe">TANRI BİLİNEMEZ. İNSAN: TANIMLAYABİLEN.</div>

<input type="text" id="girdi" placeholder="SÖZCÜĞÜ YAZIN..." autocomplete="off">
<button type="button" class="dugme" id="anaBtn">BUL. BULUNUZ. BAŞKA SÖZCÜK SORUNUZ.</button>

<div id="gosterici">HAZIR</div>

<div class="sayac" id="sayac">Sözcüklükte: 0 sözcük</div>
<button type="button" class="dugme" id="gosterBtn" style="background: #000080;">SÖZCÜKLÜĞÜ GÖSTER</button>
</div>
</div>

<script>
var YONETICI_GIZLISOZ = "kasim1973";

// HAVUZ VERİSİ
var sozverisi = [
{ A: "universite", B: "bilim kent" },
{ A: "kampus", B: "yerleske" },
{ A: "harf", B: "sesadi" },
{ A: "cebir", B: "sesadli islemler" },
{ A: "border", B: "sınır" },
{ A: "noun modifier", B: "ad niteleyicisi" },
{ A: "verb modifier", B: "eylem niteleyici" },
{ A: "all", B: "tümü" },
{ A: "how", B: "nasıl" },
{ A: "section", B: "bölüm" },
{ A: "part of", B: "bölümü" },
{ A: "groggy", B: "yorgun" },
{ A: "cell", B: "gözenek" },
{ A: "stitch", B: "dikiş" },
{ A: "fonksiyon", B: "deger donusturen" },
{ A: "computer", B: "bilgisayar" },
{ A: "software", B: "yazılım" },
{ A: "hardware", B: "donanım" },
{ A: "network", B: "ağ" },
{ A: "database", B: "veritabanı" }
];

var yonetici = false;

// GERÇEK SÖZCÜK SAYISINI BİLDİREN İŞLEV
function sayaciGuncelle() {
document.getElementById('sayac').innerHTML = 'Sözcüklükte: ' + sozverisi.length + ' sözcük';
}

function kucukHarfYalin(txt) {
if (!txt) return '';
return txt.replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase()
.replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u')
.replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c')
.trim();
}

function bulBulanSor() {
var girdi = document.getElementById('girdi').value;
var gosterici = document.getElementById('gosterici');
var aranan = kucukHarfYalin(girdi);

if (aranan === '') {
gosterici.innerHTML = 'SÖZCÜK GİRİNİZ';
return;
}

var bulunanA = '', bulunanB = '';
for (var i = 0; i < sozverisi.length; i++) {
var o = sozverisi[i];
if (kucukHarfYalin(o.A) === aranan || kucukHarfYalin(o.B) === aranan) {
bulunanA = o.A;
bulunanB = o.B;
break;
}
}

if (bulunanA !== '') {
gosterici.innerHTML = '1. ' + bulunanA + ', ' + bulunanB;
setTimeout(temizleGirdi, 2500);
} else {
gosterici.innerHTML = 'BİLMİYORUM';
}
}

// SÖZCÜKLÜĞÜ GÖSTERİNCE DİĞER BİLEŞENLERİ GİZLEYİP TÜM ALANI AÇMA
function sozcukluguGoster() {
if (!yonetici) {
var sifre = prompt("Yönetici Gizli Sözünü girin:");
if (sifre === YONETICI_GIZLISOZ) {
yonetici = true;
} else {
alert("Hatalı gizli söz!");
return;
}
}

// Girdi, düğme ve sayacı gizle ki tüm alan görüntüleyiciye kalsın
document.getElementById('girdi').style.display = 'none';
document.getElementById('anaBtn').style.display = 'none';
document.getElementById('sayac').style.display = 'none';
document.getElementById('gosterBtn').style.display = 'none';

var gosterici = document.getElementById('gosterici');
if (sozverisi.length === 0) {
gosterici.innerHTML = 'HENÜZ SÖZCÜK YOK.';
} else {
var dokum = '<button type="button" class="don-dugmesi" id="donBtn">SÖZCÜKLÜĞE DÖN</button>\n';
for (var i = 0; i < sozverisi.length; i++) {
var s = sozverisi[i];
dokum += (i + 1) + '. ' + s.A + ', ' + s.B + '\n';
}
gosterici.innerHTML = dokum;
document.getElementById('donBtn').addEventListener('click', sozcuklugeDon);
}
}

// YENİDEN ANA ARAMA EKRANINA DÖNÜŞ
function sozcuklugeDon() {
document.getElementById('girdi').style.display = 'block';
document.getElementById('anaBtn').style.display = 'block';
document.getElementById('sayac').style.display = 'block';
document.getElementById('gosterBtn').style.display = 'block';

document.getElementById('gosterici').innerHTML = 'HAZIR';
temizleGirdi();
}

function temizleGirdi() {
document.getElementById('girdi').value = '';
document.getElementById('girdi').focus();
}

document.getElementById('anaBtn').addEventListener('click', bulBulanSor);
document.getElementById('gosterBtn').addEventListener('click', sozcukluguGoster);
document.getElementById('girdi').addEventListener('keyup', function(e) {
if (e.key === 'Enter') bulBulanSor();
});

// SAYFA AÇILDIĞINDA SAYAÇ ÇALIŞIR
sayaciGuncelle();
</script>
</body>
</html>
