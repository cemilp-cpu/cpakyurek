<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÖZGÜN YAZILI BELİRLEYİCİ ORTAMI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-transform: uppercase; }
body, html { height: 100vh; overflow: hidden; background-color: #f4f6f8; color: #333; }

/* --- KAPAK EKRANI (GİRİŞ & PIN) --- */
#kapakEkrani {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: linear-gradient(135deg, #1e293b, #0f172a);
color: #fff; display: flex; flex-direction: column;
align-items: center; justify-content: center; z-index: 9999; padding: 20px;
}
.kapak-baslik { font-size: 20px; font-weight: bold; margin-bottom: 6px; letter-spacing: 1px; color: #38bdf8; text-align: center; }
.kapak-altbaslik { font-size: 14px; font-weight: bold; color: #f8fafc; margin-bottom: 20px; text-align: center; }
.pin-kutusu { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; width: 100%; max-width: 320px; text-align: center; }
.pin-input { width: 100%; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 8px; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: #fff; margin-bottom: 16px; outline: none; }
.pin-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; }
.pin-hata { color: #f87171; font-size: 12px; margin-top: 10px; display: none; }

/* --- ANA UYGULAMA --- */
#anaUygulama { display: none; height: 100vh; flex-direction: column; padding: 10px; gap: 10px; }

.ust-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 12px; font-weight: bold; color: #0369a1; }
.kilitle-btn { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }

.icerik-alani { display: flex; flex: 1; gap: 10px; height: calc(100vh - 110px); }
@media (max-width: 600px) { .icerik-alani { flex-direction: column; } }

.bolme { flex: 1; background: #fff; border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.bolme-baslik { font-size: 12px; font-weight: bold; color: #475569; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; }

textarea { flex: 1; width: 100%; padding: 8px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 6px; resize: none; outline: none; }

.dugme-alani { display: flex; gap: 8px; }
.btn { flex: 1; padding: 8px; font-size: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
.btn-ekle { background: #0284c7; }
.btn-temizle { background: #64748b; }
.btn-disa { background: #16a34a; }

.arama-kutusu { padding: 6px 10px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }

.not-listesi { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.not-kart { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.not-zaman { font-size: 10px; color: #64748b; font-weight: bold; }
.not-metin { white-space: pre-wrap; word-break: break-word; }
.not-etiketler { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.etiket { background: #e0f2fe; color: #0369a1; font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-weight: bold; }

.not-islem { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
.islem-btn { background: none; border: none; font-size: 11px; cursor: pointer; opacity: 0.6; }
.islem-btn:hover { opacity: 1; }
</style>
</head>
<body>

<!-- KAPAK EKRANI -->
<div id="kapakEkrani">
<div class="kapak-altbaslik">CEMİL PAKYÜREK</div>
<div class="kapak-baslik">ÖZGÜN YAZILI BELİRLEYİCİ ORTAMI</div>
<div class="pin-kutusu">
<input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••" />
<button onclick="girisYap()" class="pin-btn">GİRİŞ YAP</button>
<div id="pinHata" class="pin-hata">GEÇERSİZ GİZLİ SÖZ!</div>
</div>
</div>

<!-- ANA UYGULAMA EKRANI -->
<div id="anaUygulama">
<div class="ust-bar">
<span>CEMİL PAKYÜREK — ÖZGÜN YAZILI BELİRLEYİCİ ORTAMI</span>
<button onclick="kilitle()" class="kilitle-btn">KİLİTLE</button>
</div>

<div class="icerik-alani">
<!-- SOL BÖLME -->
<div class="bolme">
<div class="bolme-baslik">YENİ NOT GİRDİSİ (# İLE AÇKI EKLEYİNİZ)</div>
<textarea id="metinGirisi" placeholder="Notunuzu yazınız..."></textarea>
<div class="dugme-alani">
<button onclick="notEkle()" class="btn btn-ekle">EKLE / GÜNCELLE</button>
<button onclick="metniTemizle()" class="btn btn-temizle">TEMİZLE</button>
</div>
<button onclick="disaAktarJSON()" class="btn btn-disa" style="margin-top: 4px;">DIŞ SAKLAMA (JSON İNDİR)</button>
</div>

<!-- SAĞ BÖLME -->
<div class="bolme">
<div class="bolme-baslik">ZAMAN TABANLI TUTANAKLAR</div>
<input type="text" id="aramaKutusu" class="arama-kutusu" placeholder="Zaman veya #açkı ara..." oninput="notlariListele()">
<div id="notListesi" class="not-listesi"></div>
</div>
</div>
</div>

<script>
const GIZLI_SOZ = "1247";
let notlar = JSON.parse(localStorage.getItem("ozgun_notlar") || "[]");
let duzenlenenId = null;

function girisYap() {
const pin = document.getElementById("pinInput").value;
if (pin === GIZLI_SOZ) {
document.getElementById("kapakEkrani").style.display = "none";
document.getElementById("anaUygulama").style.display = "flex";
document.getElementById("pinHata").style.display = "none";
document.getElementById("pinInput").value = "";
notlariListele();
} else {
document.getElementById("pinHata").style.display = "block";
}
}

function kilitle() {
document.getElementById("anaUygulama").style.display = "none";
document.getElementById("kapakEkrani").style.display = "flex";
metniTemizle();
}

function metniTemizle() {
const giris = document.getElementById("metinGirisi");
giris.value = "";
duzenlenenId = null;
giris.focus();
}

function notEkle() {
const metin = document.getElementById("metinGirisi").value.trim();
if (!metin) return;

if (duzenlenenId !== null) {
const index = notlar.findIndex(n => n.id === duzenlenenId);
if (index !== -1) {
notlar[index].metin = metin;
notlar[index].guncellemeZamani = yeniZamanDamgasi();
notlar[index].etiketler = etiketleriCikar(metin);
}
duzenlenenId = null;
} else {
const yeniNot = {
id: Date.now(),
zaman: yeniZamanDamgasi(),
metin: metin,
etiketler: etiketleriCikar(metin)
};
notlar.unshift(yeniNot);
}

kaydetVeGuncelle();
metniTemizle();
}

function yeniZamanDamgasi() {
const d = new Date();
return d.getFullYear() + "-" +
String(d.getMonth() + 1).padStart(2, '0') + "-" +
String(d.getDate()).padStart(2, '0') + " " +
String(d.getHours()).padStart(2, '0') + ":" +
String(d.getMinutes()).padStart(2, '0');
}

function etiketleriCikar(metin) {
const eşleşmeler = metin.match(/#[a-zA-Z0-9çğıöşüÇĞİÖŞÜ]+/g);
return eşleşmeler ? eşleşmeler : [];
}

function notlariListele(filtreEtiket = "") {
const arama = (filtreEtiket || document.getElementById("aramaKutusu").value).toUpperCase();
const listeEl = document.getElementById("notListesi");
listeEl.innerHTML = "";

const suzulenler = notlar.filter(n =>
n.metin.toUpperCase().includes(arama) ||
n.zaman.includes(arama)
);

suzulenler.forEach(n => {
const kart = document.createElement("div");
kart.className = "not-kart";

let etiketlerHtml = n.etiketler.map(e => `<span class="etiket" onclick="etiketleAra('${e}')">${e}</span>`).join("");

kart.innerHTML = `
<div class="not-zaman">${n.zaman} ${n.guncellemeZamani ? '(GÜNCELLENDİ: '+n.guncellemeZamani+')' : ''}</div>
<div class="not-metin">${n.metin}</div>
<div class="not-etiketler">${etiketlerHtml}</div>
<div class="not-islem">
<button class="islem-btn" onclick="notDuzenleIstegi(${n.id})">✏️</button>
<button class="islem-btn" onclick="notSilIstegi(${n.id})">🗑️</button>
</div>
`;
listeEl.appendChild(kart);
});
}

function etiketleAra(etiket) {
document.getElementById("aramaKutusu").value = etiket;
notlariListele(etiket);
}

function notDuzenleIstegi(id) {
const pin = prompt("GİZLİ SÖZÜ GİRİNİZ:");
if (pin === GIZLI_SOZ) {
const hedef = notlar.find(n => n.id === id);
if (hedef) {
document.getElementById("metinGirisi").value = hedef.metin;
duzenlenenId = id;
document.getElementById("metinGirisi").focus();
}
} else if (pin !== null) {
alert("YANLIŞ GİZLİ SÖZ!");
}
}

function notSilIstegi(id) {
const pin = prompt("GİZLİ SÖZÜ GİRİNİZ:");
if (pin === GIZLI_SOZ) {
notlar = notlar.filter(n => n.id !== id);
kaydetVeGuncelle();
} else if (pin !== null) {
alert("YANLIŞ GİZLİ SÖZ!");
}
}

function kaydetVeGuncelle() {
localStorage.setItem("ozgun_notlar", JSON.stringify(notlar));
notlariListele();
}

function disaAktarJSON() {
const veriStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notlar, null, 2));
const indirmeLinki = document.createElement('a');
indirmeLinki.setAttribute("href", veriStr);
indirmeLinki.setAttribute("download", "ozgun_notlar_yedek.json");
document.body.appendChild(indirmeLinki);
indirmeLinki.click();
indirmeLinki.remove();
}
</script>
</body>
</html>
