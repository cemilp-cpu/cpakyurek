padding:9px;
border:2px solid #1f1f1f;
border-radius:8px;
resize:vertical;

}

footer{
margin-top:14px;
text-align:center;
color:#555555;
font-size:11px;
}

@media(max-width:520px){

padding:8px;
}

}

}

}

width:100%;
}

<body>

<div class="icAlan">

<span class="yildiz">★</span>

</h1>

<div class="bilgi">
1973 - İTÜ - Yüksek Yetkilendirilmiş Eksiciksel Kurgulamacı Cemil Pakyürek
</div>

<div class="sayaclar">
<div class="sayac" id="toplamSozcukSayaci">TOPLAM SÖZCÜK: 0</div>
<div class="sayac" id="bugunGezilenSayaci">BUGÜN GEZİLEN: 0</div>
<div class="sayac" id="toplamGezilenSayaci">TOPLAM GEZİLEN: 0</div>
</div>

<div class="dilAlan">
<button class="dil aktif" id="trBtn" onclick="dilSec('tr-TR')">TR</button>
<button class="dil" id="enBtn" onclick="dilSec('en-US')">EN</button>
</div>

<input
id="girdi"
type="text"
placeholder="Bir sözcük yazın..."
autocomplete="off"
>

<div class="dugmeler">
<button class="dugme" onclick="sozcukBul()">BUL</button>
<button class="dugme" onclick="temizle()">BAŞKA SÖZCÜK SOR</button>
<button class="dugme" id="sesBtn" onclick="sesliSor()">🎤 SESLİ SOR</button>
<button class="dugme" id="kopyaBtn" onclick="tumunuKopyala()">TÜMÜNÜ KOPYALA</button>
</div>

<div id="sonuc"></div>

<div class="oneri" id="oneriKutusu">
<p>Bu sözcük bulunamadı. Önerinizi yazabilirsiniz:</p>
<textarea id="oneriMetni" placeholder="Önerilen yalın Türkçe karşılık..."></textarea>
<button class="dugme" onclick="oneriGonder()">ÖNERİYİ GÖNDER</button>
</div>

<script>
const sozcukler = [

];



const arama = document.getElementById("girdi");
const sonuc = document.getElementById("sonuc");
const oneriKutusu = document.getElementById("oneriKutusu");

let konusmaDili = "tr-TR";
let sonAranan = "";

function kucult(metin){
return metin
.toLocaleLowerCase("tr-TR")
.trim()
.replace(/\s+/g," ");
}

function bugun(){
return new Date().toISOString().slice(0,10);
}

function sayaclariGuncelle(){
const tarih = localStorage.getItem("bugunTarihi");
let bugunGezilen = Number(localStorage.getItem("bugunGezilen") || 0);
let toplamGezilen = Number(localStorage.getItem("toplamGezilen") || 0);

if(tarih !== bugun()){
bugunGezilen = 0;
localStorage.setItem("bugunTarihi",bugun());
localStorage.setItem("bugunGezilen","0");
}

document.getElementById("toplamSozcukSayaci").textContent =
"TOPLAM SÖZCÜK: " + sozcukler.length;

document.getElementById("bugunGezilenSayaci").textContent =
"BUGÜN GEZİLEN: " + bugunGezilen;

document.getElementById("toplamGezilenSayaci").textContent =
"TOPLAM GEZİLEN: " + toplamGezilen;
}

function gezintiSay(){
let bugunGezilen = Number(localStorage.getItem("bugunGezilen") || 0);
let toplamGezilen = Number(localStorage.getItem("toplamGezilen") || 0);

if(localStorage.getItem("bugunTarihi") !== bugun()){
bugunGezilen = 0;
localStorage.setItem("bugunTarihi",bugun());
}

bugunGezilen++;
toplamGezilen++;

localStorage.setItem("bugunGezilen",bugunGezilen);
localStorage.setItem("toplamGezilen",toplamGezilen);

sayaclariGuncelle();
}

function dilSec(dil){
konusmaDili = dil;

document.getElementById("trBtn").classList.toggle(
"aktif",
dil === "tr-TR"
);

document.getElementById("enBtn").classList.toggle(
"aktif",
dil === "en-US"
);
}

function sozcukBul(){
const aranan = kucult(arama.value);

oneriKutusu.style.display = "none";
sonuc.className = "";

if(!aranan){
sonuc.textContent = "Lütfen bir sözcük yazın.";
return;
}

sonAranan = arama.value.trim();
gezintiSay();

const bulunanlar = [];

sozcukler.forEach(function(cift){
const a = kucult(cift.A);
const b = kucult(cift.B);

if(a === aranan){
bulunanlar.push(cift.A + " = " + cift.B);
}

if(b === aranan){
bulunanlar.push(cift.B + " = " + cift.A);
}
});

if(bulunanlar.length === 0){
sonuc.className = "hata";
sonuc.textContent =
"Bulunamadı: " + sonAranan;

oneriKutusu.style.display = "block";
document.getElementById("oneriMetni").value = "";
return;
}

sonuc.innerHTML = bulunanlar
.map(function(kayit,index){
return (index + 1) + ". " + kayit;
})
.join("<br>");
}

function temizle(){
arama.value = "";
sonuc.textContent = "";
sonuc.className = "";
oneriKutusu.style.display = "none";
arama.focus();
}

function sesliSor(){
const Tanima =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!Tanima){
sonuc.textContent =
"Bu tarayıcı sesli soru özelliğini desteklemiyor.";
return;
}

const tanima = new Tanima();
tanima.lang = konusmaDili;
tanima.interimResults = false;
tanima.maxAlternatives = 1;

sonuc.textContent = "Dinliyorum...";

tanima.start();

tanima.onresult = function(olay){
arama.value =
olay.results[0][0].transcript.trim();

sozcukBul();
};

tanima.onerror = function(){
sonuc.textContent =
"Ses alınamadı. Lütfen yeniden deneyin.";
};
}

function tumunuKopyala(){
const kod =
"<!DOCTYPE html>\n" +
document.documentElement.outerHTML;

navigator.clipboard.writeText(kod)
.then(function(){
sonuc.className = "";
sonuc.textContent =
"HTML kodunun tamamı panoya kopyalandı.";
})
.catch(function(){
const alan = document.createElement("textarea");
alan.value = kod;
document.body.appendChild(alan);
alan.select();

try{
document.execCommand("copy");
sonuc.textContent =
"HTML kodunun tamamı panoya kopyalandı.";
}catch(hata){
sonuc.textContent =
"Kod otomatik kopyalanamadı.";
}

alan.remove();
});
}

function oneriGonder(){
const oneri =
document.getElementById("oneriMetni").value.trim();

if(!oneri){
sonuc.textContent =
"Lütfen bir öneri yazın.";
return;
}

const konu =
encodeURIComponent("Yalın Türkçe sözcük önerisi");

const govde = encodeURIComponent(
"Bulunamayan sözcük: " + sonAranan +
"\nÖnerilen karşılık: " + oneri
);

window.location.href =
"mailto:cemilp@gmail.com?subject=" +
konu + "&body=" + govde;
}

arama.addEventListener("keydown",function(olay){
if(olay.key === "Enter"){
sozcukBul();
}
});

sayaclariGuncelle();
