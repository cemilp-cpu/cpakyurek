<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Güzel Sözcüklük</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#fff;font-family:Arial}
.kutu{max-width:780px;margin:20px auto;padding:8px;border:4px solid #1f1f1f;border-radius:18px;background:#fff}
.icAlan{padding:22px;border-radius:12px;background:#f7e84b;text-align:center}
h1{margin:0 0 5px;font-size:28px}
.yildiz{color:#1f1f1f;font-size:78px;line-height:1;display:inline-block;vertical-align:middle;margin-right:4px}
.baslikYazi{font-size:26px;vertical-align:middle}
.sayaçlar{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.sayaç{padding:6px 10px;border:2px solid #555;border-radius:7px;background:#fff;font-weight:bold;font-size:12px}
#girdi,#onerigirdi,#sonuç{width:100%;border:3px solid #000;border-radius:10px;padding:12px;font-size:19px;font-weight:bold;background:#fff;text-align:left}
#onerikutu{display:none;margin-top:12px;padding:12px;border:2px solid #000;border-radius:10px;background:#fff;text-align:left}
#sonuç{margin-top:12px;min-height:56px;white-space:pre-wrap}
.dugmeler{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.dugme{padding:9px 14px;background:#333;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.kucukBtn{padding:5px 9px;margin-left:5px;border:0;border-radius:5px;font-weight:bold;cursor:pointer;color:#fff}
</style>
</head>
<body>
<div class="kutu"><div class="icAlan">
<h1><span class="yildiz">★</span><span class="baslikYazi">GÜZEL SÖZCÜKLÜK</span></h1>
<div class="sayaçlar">
<div class="sayaç" id="toplamSozcuk">TOPLAM SÖZCÜK: 0</div>
<div class="sayaç" id="bugunGezilen">BUGÜN GEZİLEN: 0</div>
<div class="sayaç" id="toplamGezilen">TOPLAM GEZİLEN: 0</div>
</div>
<input id="girdi" placeholder="Bir sözcük yazın...">
<div class="dugmeler">
<button class="dugme" onclick="bul()">BUL</button>
<button class="dugme" onclick="baskaSor()">BAŞKA SÖZCÜK SOR</button>
<button class="dugme" onclick="sesliSor()">SESLİ SOR</button>
<button class="dugme" onclick="tumuKopyala()">TÜMÜNÜ KOPYALA</button>
</div>
<div id="sonuç">Hazır.</div>
<div id="onerikutu">
<div style="font-weight:bold;margin-bottom:6px">Bulunamadı. Öneriniz:</div>
<input id="onerigirdi" placeholder="Yalın Türkçe karşılığı...">
<div class="dugmeler"><button class="dugme" onclick="oneriGonder()">ÖNERİYİ GÖNDER</button></div>
</div>
<div id="havuzAlani" style="display:none;margin-top:14px;padding:10px;border:2px dashed #000;background:#fff;border-radius:10px;text-align:left">
<h3 style="margin:0 0 8px">HAVUZ - Yönetici</h3>
<div id="liste"></div>
<div class="dugmeler" style="margin-top:10px">
<button class="dugme" style="background:#1a7a1a" onclick="tumuOnayla()">TÜMÜNÜ ONAYLA</button>
<button class="dugme" style="background:#a00" onclick="tumuSil()">TÜMÜNÜ SİL</button>
<button class="dugme" onclick="havuzKapa()">KAPAT</button>
</div>
</div>
</div></div>
<footer style="text-align:center;font-size:11px;margin-top:10px">Cemil Pakyürek — Yalın Türkçe Sözcüklük</footer>

<script>
let temel=[
{A:"fallow",B:"izle"},
{A:"atom",B:"ögecik"},
{A:"mikrofon",B:"ses alıcısı"},
{A:"bilgisayar",B:"bilgi sayar"}
// ... GitHub'daki diğer 34 sözcüğü buraya ekleyin
{ A: "open" , B: "aç" },
{ A: "door" , B: "kapı" },
{ A: "sit down" , B: "otur" },
{ A: "stand up" , B: "kalk" },
{ A: "wash" , B: "yıka" },
{ A: "dishes" , B: "tabaklari" },
{ A: "clean" , B: "temizle" },
{ A: "table" , B: "masa" },
{ A: "come" , B: "gel" },
{ A: "here" , B: "bura" },
{ A: "edit" , B: "düzelt" },
{ A: "go" , B: "git" },
{ A: "outside" , B: "dışarıya" },
{ A: "walk " , B: "yürü" },
{ A: "slowly" , B: "yavaşça" },
{ A: "wait" , B: "bekle" },
{ A: "fallow" , B: "izle" },
{ A: "eat" , B: "ye" },
{ A: "food" , B: "beslm" },
{ A: "cut" , B: "kes" },
{ A: "bfead" , B: "ekmek" },
{ A: "run" , B: "koş" },
{ A: "fast" , B: "hızlı" },
{ A: "watch" , B: "bak" },
{ A: "ring" , B: "çınla" },
{ A: "drink" , B: "iç" },
{ A: "road" , B: "yol" },
{ A: "taste" , B: "tad" },
{ A: "soak" , B: "ıslat" },
{ A: "termant" , B: "mayala" },
{ A: "thaw" , B: "çözdür" },
{ A: "crush" , B: "ez" },
{ A: "crack" , B: "çatlat" },
{ A: "scrape" , B: "kazı" },
{ A: "wrap" , B: "sar" },
{ A: "carwe" , B: "oy" },
{ A: "brew" , B: "demle" },
{ A: "clipboard" , B: "geçici bellek" },
{ A: "flash bellek" , B: "hızlı bellek sürücü" },
{ A: "hdd" , B: "yuvar bellek sürücü" },
{ A: "micro sd" , B: "küçücük güvenli sayısal" },
{ A: "pano" , B: "geçici bellek" },
{ A: "screamad" , B: "çığllık attı" },
{ A: "sd bellek" , B: "güvenli sayısal bellek" },
{ A: "sdhc" , B: "yüksek sığalı güvenli sayısal" },
{ A: "sduc" , B: "aşırı yüksek güvenli sayısal" },
{ A: "sdxc" , B: "geniş stğalı güvenli sayısal" },
{ A: "secure dijital" , B: "güvenli sayısal" },
{ A: "standart sd" , B: "tanımlı güvenli sayısal " },
{ A: "web speech api" , B: "sanal yöre kouşma arayüzü" },
{ A: "windows v" , B: "geçici bellek geçmişi" },
{ A: "would leave" , B: "bırakacaktı" },
{ A: "would lose" , B: "kaybedecekti" },

{A:"bilgisayar",B:"bilgi işler"}


 
];
 


function tumu(){let ek=JSON.parse(localStorage.getItem("ek")||"[]");return temel.concat(ek);}
function kucult(s){return s.toLocaleLowerCase("tr-TR").trim();}

(function(){
let bugunStr=new Date().toLocaleDateString("tr-TR");
let toplam=parseInt(localStorage.getItem("toplamGezilen")||"0")+1;
localStorage.setItem("toplamGezilen",toplam);
let sonGun=localStorage.getItem("sonGun");
let bugunSay=parseInt(localStorage.getItem("bugunGezilen")||"0");
if(sonGun!==bugunStr){bugunSay=1;localStorage.setItem("sonGun",bugunStr);}else{bugunSay++;}
localStorage.setItem("bugunGezilen",bugunSay);
document.getElementById("toplamGezilen").textContent="TOPLAM GEZİLEN: "+toplam;
document.getElementById("bugunGezilen").textContent="BUGÜN GEZİLEN: "+bugunSay;
document.getElementById("toplamSozcuk").textContent="TOPLAM SÖZCÜK: "+tumu().length;
})();

function konus(m){
speechSynthesis.cancel();
if(!m) return;
let u=new SpeechSynthesisUtterance(m.replaceAll("→"," karşılık ").replaceAll("\n"," . "));
u.lang="tr-TR";
u.rate=0.42;
u.pitch=1.05;
u.volume=1;
let sesler=speechSynthesis.getVoices();
let turk=sesler.find(v=>v.lang.toLowerCase()==="tr-tr")||sesler.find(v=>v.lang.toLowerCase().includes("tr"));
if(turk) u.voice=turk;
speechSynthesis.speak(u);
}

function bul(){
let ham=document.getElementById("girdi").value.trim();
let a=kucult(ham);
if(!a){document.getElementById("sonuç").textContent="Sözcük yazmadınız";konus("Sözcük yazmadınız");return;}
let es=[];
tumu().forEach(o=>{
if(kucult(o.A)===a) es.push(o.A+" → "+o.B);
if(kucult(o.B)===a) es.push(o.B+" → "+o.A);
});
let sonucEl=document.getElementById("sonuç");
let oneriEl=document.getElementById("onerikutu");
if(es.length>0){
oneriEl.style.display="none";
let metin=es.length===1?es[0]:es.length+" yanıt bulundu:\n"+es.map((s,i)=>(i+1)+". "+s).join("\n");
sonucEl.textContent=metin;
konus(metin);
}else{
let msg="Bulunamadı: "+ham+"\n\nÖneriniz varsa yazınız.";
sonucEl.textContent=msg;
oneriEl.style.display="block";
konus("Bulunamadı. "+ham+". Öneriniz varsa yazınız.");
}
}

function baskaSor(){document.getElementById("girdi").value="";document.getElementById("sonuç").textContent="Hazır.";document.getElementById("onerikutu").style.display="none";document.getElementById("girdi").focus();speechSynthesis.cancel();}
function tumuKopyala(){let t=tumu().map(o=>o.A+" → "+o.B).join("\n");navigator.clipboard.writeText(t).then(function(){document.getElementById("sonuç").textContent="Tümü kopyalandı. "+tumu().length+" sözcük.";konus("Tümü kopyalandı");});}
function oneriGonder(){let aranan=document.getElementById("girdi").value.trim();let oneri=document.getElementById("onerigirdi").value.trim();if(!oneri){konus("Öneri yazmadınız");return;}let havuz=JSON.parse(localStorage.getItem("havuz")||"[]");havuz.push({aranan:aranan,oneri:oneri,tarih:new Date().toLocaleString("tr-TR")});localStorage.setItem("havuz",JSON.stringify(havuz));document.getElementById("sonuç").textContent="Öneriniz alındı: "+(aranan?aranan+" → ":"")+oneri;konus("Öneriniz alındı");document.getElementById("onerigirdi").value="";document.getElementById("onerikutu").style.display="none";listele();}

// SESLİ SOR - DONMAYAN
function sesliSor(){dinle();}
function dinle(){
const T=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!T){document.getElementById("sonuç").textContent="Bu aygıt sesliyi desteklemiyor";konus("Bu aygıt sesliyi desteklemiyor");return;}
const rec=new T();
rec.lang="tr-TR";
rec.interimResults=false;
rec.continuous=false;
rec.maxAlternatives=1;
document.getElementById("sonuç").textContent="Dinliyorum... söyleyin";
speechSynthesis.cancel();
setTimeout(function(){
try{rec.start();}catch(e){}
},300);
rec.onresult=function(e){
let metin=e.results[0][0].transcript.trim();
document.getElementById("girdi").value=metin;
bul();
};
rec.onerror=function(ev){
if(ev.error==="not-allowed"){
document.getElementById("sonuç").textContent="Mikrofon izni yok. Adres çubuğundaki kilitten izin verin.";
konus("Mikrofon izni yok");
}else{
document.getElementById("sonuç").textContent="Anlamadım, tekrar söyleyin";
konus("Anlamadım, tekrar söyleyin");
}
};
} // dinle bitiş

function listele(){let h=JSON.parse(localStorage.getItem("havuz")||"[]");document.getElementById("liste").innerHTML=h.map(function(x,i){return '<div style="margin:8px 0;padding:6px;border:1px solid #999;border-radius:6px;background:#fffef0">'+(x.aranan?x.aranan+' → ':'')+x.oneri+' <small>('+ (x.tarih||'')+')</small> <button class="kucukBtn" style="background:#1a7a1a" onclick="onay('+i+')">Onayla</button><button class="kucukBtn" style="background:#a00" onclick="sil('+i+')">Sil</button></div>';}).join("")||"Havuz boş";document.getElementById("toplamSozcuk").textContent="TOPLAM SÖZCÜK: "+tumu().length;}
function onay(i){let h=JSON.parse(localStorage.getItem("havuz")||"[]");let k=h[i];let ek=JSON.parse(localStorage.getItem("ek")||"[]");ek.push({A:(k.aranan||k.oneri),B:k.oneri});localStorage.setItem("ek",JSON.stringify(ek));h.splice(i,1);localStorage.setItem("havuz",JSON.stringify(h));listele();konus("Onaylandı");}
function sil(i){let h=JSON.parse(localStorage.getItem("havuz")||"[]");h.splice(i,1);localStorage.setItem("havuz",JSON.stringify(h));listele();}
function tumuOnayla(){let h=JSON.parse(localStorage.getItem("havuz")||"[]");if(h.length===0) return;let ek=JSON.parse(localStorage.getItem("ek")||"[]");h.forEach(function(k){ek.push({A:(k.aranan||k.oneri),B:k.oneri});});localStorage.setItem("ek",JSON.stringify(ek));localStorage.setItem("havuz",JSON.stringify([]));listele();konus("Tümü onaylandı");}
function tumuSil(){let h=JSON.parse(localStorage.getItem("havuz")||"[]");if(h.length===0) return;localStorage.setItem("havuz",JSON.stringify([]));listele();konus("Havuz temizlendi");}
function havuzAc(){document.getElementById("havuzAlani").style.display="block";listele();document.getElementById("havuzAlani").scrollIntoView({behavior:"smooth"});konus("Yönetici havuzu açıldı");}
function havuzKapa(){document.getElementById("havuzAlani").style.display="none";}
if(location.hash==="#yonetici"){havuzAc();}
window.addEventListener("hashchange",function(){if(location.hash==="#yonetici"){havuzAc();}});
document.addEventListener("keydown",function(e){if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="y"){e.preventDefault();let a=document.getElementById("havuzAlani");if(a.style.display==="none"||a.style.display===""){havuzAc();}else{havuzKapa();}}});
</script>
</body>
</html>
