<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yalın Türkçe Sözcük</title>
<style>
:root { --bg: #f4f6f9; --yellow: #f1c40f; --blue: #2c3e50; --red: #e74c3c; --text: #333; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.container { width: 100%; max-width: 550px; background: #fff; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); overflow: hidden; border: 3px solid var(--blue); }
.header { background: var(--yellow); padding: 15px; text-align: center; border-bottom: 3px solid var(--blue); position: relative; }
.title { font-size: 22px; font-weight: bold; color: var(--blue); margin: 0; display: flex; justify-content: center; align-items: center; gap: 8px; }
.star { color: var(--red); font-size: 26px; }
.admin-btn { position: absolute; top: 12px; right: 12px; background: var(--blue); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.content { padding: 15px; }
.group { margin-bottom: 12px; }
label { display: block; font-size: 15px; font-weight: bold; color: var(--blue); margin-bottom: 5px; }
input, textarea, select { width: 100%; padding: 10px; box-sizing: border-box; border: 2px solid var(--blue); border-radius: 6px; font-size: 15px; font-weight: bold; color: var(--text); background: #fff; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.btn { background: var(--blue); color: #fff; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; }
.btn-full { grid-column: span 2; background: #7f8c8d; }
.panel { background: #3498db; color: #fff; padding: 12px; border-radius: 6px; min-height: 60px; border: 2px solid var(--blue); }
.p-text { font-size: 15px; font-weight: bold; margin: 0; line-height: 1.4; }
.counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; background: #f1f2f6; border-top: 3px solid var(--blue); }
.card { padding: 8px; text-align: center; border-radius: 6px; color: #fff; border: 2px solid var(--blue); }
.blue-c { background: #2980b9; } .orange-c { background: #e67e22; } .green-c { background: #27ae60; }
.c-title { font-size: 10px; font-weight: bold; margin-bottom: 3px; }
.c-val { font-size: 18px; font-weight: bold; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
.modal-box { background: #fff; padding: 15px; border-radius: 10px; width: 90%; max-width: 400px; border: 3px solid var(--blue); }
.sug-item { background: #f8f9fa; padding: 8px; margin-top: 5px; border-left: 4px solid #3498db; font-size: 13px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
<div class="header">
<button class="admin-btn" onclick="openAdmin()">Yönetici</button>
<h1 class="title"><span class="star">★</span> Yalın Türkçe Sözcük</h1>
</div>
<div class="content">
<div class="group">
<label for="wordInput">Sözcük Sorgulama Alanı</label>
<input type="text" id="wordInput" placeholder="Aranacak sözcüğü yazınız...">
</div>
<div class="grid">
<button class="btn" onclick="searchWord()">🔍 BUL</button>
<button class="btn" onclick="clearFields()">➕ BAŞKA SÖZCÜK SOR</button>
<button class="btn" onclick="speakText()">🔊 SESLİ SOR</button>
<button class="btn" onclick="speakResult()">🗣️ O SESLENDİRSİN</button>
<button class="btn btn-full" onclick="listAll()">📋 TÜMÜNÜ SIRALI DÖK</button>
</div>
<div class="group">
<label for="langSel">Seslendirme Dili</label>
<select id="langSel">
<option value="tr-TR">Türkçe</option><option value="en-US">İngilizce</option>
<option value="de-DE">Almanca</option><option value="mk-MK">Makedonca</option>
<option value="sq-AL">Arnavutça</option><option value="bs-BA">Boşnakça</option>
<option value="sr-RS">Sırpça</option><option value="hr-HR">Hırvatça</option>
</select>
</div>
<div class="group">
<label>Yanıt ve Anlam Alanı</label>
<div class="panel"><p id="resOut" class="p-text">Arama sonuçları burada görüntülenecektir.</p></div>
</div>
<div class="group">
<label for="sugInp">Soru ve Önerilerinizi İletin</label>
<textarea id="sugInp" rows="2" placeholder="Önerinizi yazın..."></textarea>
<button class="btn" style="width:100%; margin-top:5px; background:#27ae60;" onclick="sendSug()">Yönlendir / Gönder</button>
</div>
</div>
<div class="counters">
<div class="card blue-c"><div class="c-title">TOPLAM SÖZCÜK</div><div id="cTot" class="c-val">2583</div></div>
<div class="card orange-c"><div class="c-title">GEZİYOR OLAN</div><div id="cAct" class="c-val">12</div></div>
<div class="card green-c"><div class="c-title">GEZMİŞ OLAN</div><div id="cHis" class="c-val">145</div></div>
</div>
</div>

<div id="admMod" class="modal">
<div class="modal-box">
<h3 style="margin:0 0 10px 0; color:var(--blue);">🔒 Yönetici Değerlendirme Paneli</h3>
<div id="sugLst" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px;"></div>
<button class="btn" style="width:100%;" onclick="closeAdmin()">Kapat</button>
</div>
</div>

<script>
// KİRLİL VE LATİN HARF UYUMLU SÖZCÜK LİSTENİZ
let sozcuk = [
{ A:"aciz", B:"yapabilemez"},
{ A:"adalet", B:"gerçeklere bağlılık"},
{ A:"adam", B:"tanımlayabilen er"},
{ A:"чивек", B:"tanımlayabilen er (adam)"}
];

let userSuggestions = ["Uygulamaya 'Gönül' sözcüğü de eklenmeli."];

function updateCounters() {
let act = document.getElementById('cAct'), his = document.getElementById('cHis');
if(!act || !his) return;
let vAct = parseInt(act.innerText) || 12;
act.innerText = Math.max(2, vAct + (Math.random() > 0.5 ? 1 : -1));
if(Math.random() > 0.7) his.innerText = (parseInt(his.innerText) || 145) + 1;
}
setInterval(updateCounters, 4000);

// Evrensel Alfabe (Kiril/Latin) Uyumlu Arama Fonksiyonu
function searchWord() {
const inp = document.getElementById('wordInput').value.trim();
const out = document.getElementById('resOut');
if (!inp) { out.innerText = "Lütfen sorgulamak için bir sözcük giriniz."; return; }

let his = document.getElementById('cHis');
if(his) his.innerText = (parseInt(his.innerText) || 145) + 1;

// Kiril ve Latin harflerini dile duyarlı olarak karşılaştırır
const found = sozcuk.find(item => item && item.A && item.A.trim().localeCompare(inp, undefined, { sensitivity: 'accent', usage: 'search' }) === 0);

if (found) out.innerText = `${found.A.toUpperCase()}: ${found.B}`;
else out.innerText = `"${inp}" sözcüğü sözlükte bulunamadı. Öneri alanından eklenmesini talep edebilirsiniz.`;
}

function clearFields() { document.getElementById('wordInput').value = ""; document.getElementById('resOut').innerText = "Yeni arama için hazır."; }
function listAll() { const out = document.getElementById('resOut'); if(!out) return; out.innerText = "Sözlükteki Kelimeler:\n" + sozcuk.filter(i => i && i.A).map(i => i.A.toUpperCase()).sort().join(", "); }

function uSpeak(text) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const ut = new SpeechSynthesisUtterance(text);
ut.lang = document.getElementById('langSel').value;
window.speechSynthesis.speak(ut);
} else { alert("Ses desteği yok."); }
}
function speakText() { const inp = document.getElementById('wordInput').value; uSpeak(inp ? inp : "Lütfen bir sözcük giriniz."); }
function speakResult() { uSpeak(document.getElementById('resOut').innerText); }

function sendSug() {
const inp = document.getElementById('sugInp');
if (inp && inp.value.trim() !== "") { userSuggestions.push(inp.value.trim()); inp.value = ""; alert("Öneriniz yöneticiye yönlendirildi."); }
else { alert("Boş öneri gönderilemez."); }
}

function openAdmin() {
if (prompt("Gizli sözü giriniz:") === "kasim1973") {
const lst = document.getElementById('sugLst'); if(!lst) return; lst.innerHTML = "";
userSuggestions.forEach(s => { const d = document.createElement('div'); d.className = "sug-item"; d.innerText = s; lst.appendChild(d); });
document.getElementById('admMod').style.display = "flex";
} else { alert("Hatalı gizli söz!"); }
}
function closeAdmin() { document.getElementById('admMod').style.display = "none"; }
if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); }
</script>
</body>
</html>
