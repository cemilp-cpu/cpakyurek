// Yazılan harfleri ekranda Türkçe BÜYÜK harfe çevirir
function harfleriBuyut(eleman) {
let konum = eleman.selectionStart;
eleman.value = eleman.value.toLocaleUpperCase('tr-TR');
eleman.setSelectionRange(konum, konum);
}

// Sayfa ilk açıldığında havuzdaki sözcük sayısını ekrana yazar
function sayaciBaslat() {
document.getElementById("sayacEkrani").innerText = "TOPLAM SÖZCÜK: " + veriHavuzu.length;
}

// Sözcük Arama İşlevi (Harf büyüklüğüne ve A/B yapısına tam uyumlu)
function sozcukAra() {
let aranan = document.getElementById("aramaKutusu").value.trim().toLocaleUpperCase('tr-TR');
let ekran = document.getElementById("metinEkrani");

if (aranan === "") {
ekran.innerText = "Lütfen bir sözcük yazınız.";
return;
}

// A veya B alanlarında büyük/küçük harf fark etmeksizin arama yapar
let sonuc = veriHavuzu.find(o => {
let degerA = String(o.A || o.yabanci || "").toLocaleUpperCase('tr-TR');
let degerB = String(o.B || o.turkce || "").toLocaleUpperCase('tr-TR');
return degerA === aranan || degerB === aranan;
});

if (sonuc) {
let yabanciMetin = String(sonuc.A || sonuc.yabanci).toLocaleUpperCase('tr-TR');
let turkceMetin = String(sonuc.B || sonuc.turkce).toLocaleUpperCase('tr-TR');

ekran.innerHTML = "<b>Yabancı Sözcük:</b> " + yabanciMetin +
"<br><b>Yalın Türkçe Karşılığı:</b> " + turkceMetin;
} else {
ekran.innerText = "Aranan sözcük bulunamadı.";
}
}

// Temizleme İşlevi
function temizle() {
document.getElementById("aramaKutusu").value = "";
document.getElementById("metinEkrani").innerText = "Kelime yazıp Ara tuşuna basın.";
}

// Sayfa yüklendiğinde otomatik çalışır
window.onload = sayaciBaslat;
</script>
